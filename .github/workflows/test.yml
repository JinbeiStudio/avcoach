name: Tests API

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run API tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test

      - name: Check static build
        run: npm run build:static

      # Bloque la PR si elle écrase un texte modifié par la cliente en production
      - name: Check content sync with production
        if: github.event_name == 'pull_request'
        run: npm run sync:check
        env:
          BASE_REF: origin/${{ github.base_ref }}
